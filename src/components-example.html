<!-- DaisyUI 组件示例 - 复制粘贴即可使用 -->

<!-- 1. 基础卡片 -->
<div class="card bg-base-100 shadow-md mb-6">
    <div class="card-body">
        <h2 class="card-title">卡片标题</h2>
        <p>卡片内容描述...</p>
        <div class="card-actions justify-end">
            <button class="btn btn-primary">按钮</button>
        </div>
    </div>
</div>

<!-- 2. 按钮组 -->
<div class="flex gap-2 mb-6">
    <button class="btn btn-primary">主要按钮</button>
    <button class="btn btn-secondary">次要按钮</button>
    <button class="btn btn-outline">轮廓按钮</button>
</div>

<!-- 3. 表单输入 -->
<div class="form-control mb-6">
    <label class="label">
        <span class="label-text">输入框标签</span>
    </label>
    <input type="text" placeholder="请输入内容" class="input input-bordered">
</div>

<!-- 4. 文本区域 -->
<textarea class="textarea textarea-bordered w-full" placeholder="多行文本输入"></textarea>

<!-- 5. 警告框 -->
<div class="alert alert-info mb-6">
    <span>这是一个信息提示</span>
</div>

<div class="alert alert-success mb-6">
    <span>操作成功！</span>
</div>

<!-- 6. 加载动画 -->
<div class="flex justify-center mb-6">
    <span class="loading loading-spinner loading-lg"></span>
</div>

<!-- 7. 进度条 -->
<div class="mb-6">
    <div class="flex justify-between mb-2">
        <span>进度</span>
        <span>70%</span>
    </div>
    <progress class="progress progress-primary w-full" value="70" max="100"></progress>
</div>

<!-- 8. 标签页 -->
<div class="tabs mb-6">
    <a class="tab tab-active">标签1</a>
    <a class="tab">标签2</a>
    <a class="tab">标签3</a>
</div>

<!-- 9. 折叠面板 -->
<div class="collapse collapse-plus bg-base-200 mb-6">
    <input type="radio" name="my-accordion" checked="checked" />
    <div class="collapse-title text-xl font-medium">点击展开</div>
    <div class="collapse-content">
        <p>折叠内容在这里</p>
    </div>
</div>
